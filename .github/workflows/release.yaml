name: Release and Publish

on:
  workflow_dispatch:
    inputs:
      intro:
        description: |
          Intro of the release

          The intro should be 1-2 sentences long, must be written in active
          voice, and should clearly communicate the theme of the release to the
          user. Use full sentences and avoid abbreviations.
        required: true
        type: string
      title:
        description: |
          User-facing release title (auto-generated if omitted)
        required: false
        type: string
      bump:
        description: |
          Version bump: major, minor, or patch (inferred from the changelog if
          omitted)
        required: false
        type: string
      version:
        description: |
          Explicit release version, such as v0.0.1 (instead of a bump)
        required: false
        type: string

jobs:
  release:
    name: Create GitHub release
    uses: tenzir/ship/.github/workflows/release.yaml@main
    permissions:
      contents: write
    with:
      intro: ${{ inputs.intro }}
      title: ${{ inputs.title }}
      bump: ${{ inputs.bump }}
      version: ${{ inputs.version }}

  publish:
    name: Publish package to npm
    needs: release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ needs.release.outputs.version }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Publish to npm
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          # A version published by hand, such as a name reservation, already exists.
          if npm view "pi-rex@${VERSION#v}" version >/dev/null 2>&1; then
            echo "pi-rex@${VERSION#v} is already on npm; skipping"
          else
            npm publish
          fi
